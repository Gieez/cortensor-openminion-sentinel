[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortensor-openminion-sentinel"
version = "0.1.0"
description = "Autonomous Web3 Security Sentinel & PoUW Gas Rebate Triage Agent powered by OpenMinion 0.1 SDK on Cortensor Mainnet Full Alpha"
readme = "README.md"
authors = [{ name = "Gieez", email = "gieez@users.noreply.github.com" }]
requires-python = ">=3.11"
dependencies = [
    "openminion==0.1.4",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
cortensor-sentinel = "run_sentinel:main"
